apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: grade-submission
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
  serviceName: mdb-service
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: "admin"
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: "password123"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mdb-persistent-storage
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mdb-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 0.5Gi
