apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-portal
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-portal
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: grade-portal
    spec:
      containers:
      - name: grade-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        env:
          - name: GRADE_SERVICE_HOST
            value: grade-api-service
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5001
