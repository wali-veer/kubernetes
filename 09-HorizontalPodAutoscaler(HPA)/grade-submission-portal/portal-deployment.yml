apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-deployment
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: portal-deployment
  strategy:
    type: RollingUpdate 
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: portal-deployment
        app.kubernetes.io/name: portal-deployment 
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: portal-deployment
        image: rslim087/kubernetes-course-grade-submission-portal
        livenessProbe:
          httpGet: 
            path: /healthz
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe: 
          httpGet: 
            path: /readyz
            port: 5001  
          periodSeconds: 5
        envFrom:
          - configMapRef:
              name: portal-config
        resources:
          limits:
            memory: "128Mi"
          requests:
            memory: "128Mi"
            cpu: "128m"
        ports:
        - containerPort: 5001
