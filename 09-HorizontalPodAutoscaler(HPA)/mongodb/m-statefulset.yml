apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: m-statefulset
  namespace: grade-submission
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
  serviceName: m-service
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        envFrom:
          - secretRef:
              name: m-secret
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: m-volume
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: m-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 0.5Gi
