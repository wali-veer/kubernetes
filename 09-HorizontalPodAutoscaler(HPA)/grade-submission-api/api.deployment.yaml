apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: grade-submission 
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: api-deployment
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: api-deployment
        app.kubernetes.io/name: api-deployment
        app.kubernetes.io/component: backend
    spec:
      containers:
      - name: api-deployment
        image: rslim087/kubernetes-course-grade-submission-api:stateless-v3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        envFrom:
          - configMapRef:
              name: apiconfig
          - secretRef:
              name: apisecret
        resources:
          limits:
            memory: "128Mi"
          requests:
            memory: "128Mi"
            cpu: "128m"  
        ports:
          - containerPort: 3000
