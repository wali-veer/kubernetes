apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-api-deployment
  namespace: grade-submission
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: grade-api
    spec:
        containers:
        - name: grade-api
          image: rslim087/kubernetes-course-grade-submission-api:stateless
          resources:
            limits:
              memory: "128Mi"
            requests:
                memory: "128Mi"
                cpu: "128m"
          ports:
            - containerPort: 3000