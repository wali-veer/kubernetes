apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-api-deployment
  namespace: grade-submission
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-api-deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template: 
    metadata:
      labels:
        app.kubernetes.io/name: grade-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: grade-api-deployment
    spec:
      containers:
      - name: grade-api
        image: rslim087/kubernetes-course-grade-submission-api:stateless
        livenessProbe:
          httpGet: 
            path: /healthz
            port: 3000 
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            memory: "128Mi"
          requests:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
