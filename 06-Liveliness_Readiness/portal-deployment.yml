apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-portal-deployment
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-portal-deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-portal
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: grade-portal-deployment
    spec:
      containers:
      - name: grade-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        livenessProbe:
          httpGet: 
            path: /healthz
            port: 5001 
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
          - name: GRADE_SERVICE_HOST
            value: grade-api-service
        resources:
          limits:
            memory: "128Mi"
          requests:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5001


