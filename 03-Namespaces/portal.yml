apiVersion: v1
kind: Pod
metadata:
  name: grade-portal
  namespace: grade-submission
  labels:
    app.kubernetes.io/name: grade-portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: grade-portal
spec:
  containers:
  - name: grade-portal
    image: rslim087/kubernetes-course-grade-submission-portal
    env:
      - name: GRADE_SERVICE_HOST
        value: grade-api-service
    resources:
      limits:
        memory: "128Mi"
      requests:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 5001