apiVersion: v1
kind: Pod
metadata:
  name: grade-portal
  labels:
    app.kubernetes.io/name: grade-portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: grade-portal
spec:
  containers:
  - name: grade-portal
    image: rslim087/kubernetes-course-grade-submission-portal
    resources:
      limits:
        memory: "128Mi"
      requests:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 5001

  - name: grade-portal-health-checker
    image: rslim087/kubernetes-course-grade-submission-portal-health-checker
    resources:
      limits:
        memory: "128Mi"
      requests:
        memory: "128Mi"
        cpu: "200m"
